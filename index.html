<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1a1a2e;--muted:#718096;--accent:#e94560;--border:#e2e8f0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text)}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:min(92vw,400px);box-shadow:0 10px 40px rgba(26,26,46,.08)}

label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;margin:6px 0 12px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none}
input[type=password]:focus{border-color:#0f3460}
button{width:100%;padding:11px;border:0;border-radius:10px;background:#0f3460;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6}.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:14px}
.err{color:var(--accent);font-size:12px;min-height:16px;margin-top:10px}.foot{font-size:11px;color:var(--muted);margin-top:18px;text-align:center}
</style></head><body>

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b2a(DATA.salt), iterations: DATA.iters, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(DATA.iv) }, key, b2a(DATA.ct));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
(async () => {
  try { const raw = localStorage.getItem('yk_pm_key'); if (raw) { const key = await crypto.subtle.importKey('raw', b2a(raw), 'AES-GCM', true, ['decrypt']); await openWith(key); } }
  catch (e) { try { localStorage.removeItem('yk_pm_key'); } catch (_) {} }
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = ''; btn.textContent = 'Opening…';
  try {
    const key = await deriveKey(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) { try { const raw = await crypto.subtle.exportKey('raw', key); localStorage.setItem('yk_pm_key', btoa(String.fromCharCode(...new Uint8Array(raw)))); } catch (_) {} }
    await openWith(key);
  } catch (e) { err.textContent = 'Wrong password - please try again.'; btn.disabled = false; btn.textContent = 'Open'; document.getElementById('pw').select(); }
});
})();
